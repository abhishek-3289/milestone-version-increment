name: Milestone Version Increment
description: Increment the latest tag and create milestone using semver
author: Abhishek Bansal

branding:
  icon: tag
  color: blue

inputs:
  increment-type:
    description: Provide increment type [patch, minor, major]
    required: false
    default: patch
  increment:
    description: Provide increment value
    required: false
    default: '1'
  prefix:
    description: Provide prefix used for milestone title
    required: false
    default: ''
  due-date:
    description: Provide due date for milestone in ISO 8601 format (YYYY-MM-DDTHH:MM:SSZ)
    required: false
    default: ''
  due-day-increment:
    description: Provide number of days to add in current day for due date; takes precedence over due-date
    required: false
    default: ''
  description:
    description: Provide description for milestone
    required: false
    default: ''
  github-token:
    description: Token used to create the milestone; needs issues write permission
    required: false
    default: ${{ github.token }}

outputs:
  title:
    description: Title of milestone with prefix
  version:
    description: Version of milestone
  number:
    description: Number of milestone

runs:
  using: node24
  main: src/index.js
