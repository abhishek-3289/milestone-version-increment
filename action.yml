name: Milestone Version Increment
description: Increment the latest tag and create milestone using semver
author: Abhishek Bansal

branding:
  icon: tag
  color: blue

inputs:
  increment-type:
    description: Provide increment type [patch, minor, major]
    required: false
    default: patch
  increment:
    description: Provide increment value
    required: false
    default: '1'
  prefix:
    description: Provide prefix used for milestone title
    required: false
    default: ''
  due-date:
    description: Provide due date for milestone in ISO 8601 format (YYYY-MM-DDTHH:MM:SSZ)
    required: false
    default: ''
  due-day-increment:
    description: Provide number of days to add in current day for due date; takes precedence over due-date
    required: false
    default: ''
  description:
    description: Provide description for milestone
    required: false
    default: ''
  github-token:
    description: Token used to create the milestone; needs issues write permission
    required: false
    default: ${{ github.token }}

outputs:
  title:
    description: Title of milestone with prefix
    value: ${{ steps.title.outputs.milestone_title }}
  version:
    description: Version of milestone
    value: ${{ steps.title.outputs.milestone_version }}
  number:
    description: Number of milestone
    value: ${{ steps.milestone.outputs.number }}

runs:
  using: composite
  steps:
    - name: Fetch tag and create milestone title
      id: title
      shell: bash
      env:
        INCREMENT_TYPE: ${{ inputs.increment-type }}
        INCREMENT: ${{ inputs.increment }}
        PREFIX: ${{ inputs.prefix }}
      run: '"$GITHUB_ACTION_PATH/version_script.sh" "$INCREMENT_TYPE" "$INCREMENT" "$PREFIX"'

    - name: Milestone due date
      id: date
      shell: bash
      env:
        DUE_DATE: ${{ inputs.due-date }}
        DUE_DAY_INCREMENT: ${{ inputs.due-day-increment }}
      run: |
        DUE_ON=$DUE_DATE
        if [[ -n $DUE_DAY_INCREMENT ]]; then
          if ! [[ $DUE_DAY_INCREMENT =~ ^[0-9]+$ ]]; then
            echo "::error::due-day-increment must be a whole number of days, got '$DUE_DAY_INCREMENT'"
            exit 1
          fi
          DUE_ON=$(date -u -d "+$DUE_DAY_INCREMENT days" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -v+"${DUE_DAY_INCREMENT}"d +%Y-%m-%dT%H:%M:%SZ)
        fi
        echo "milestone_due=$DUE_ON" >> "$GITHUB_OUTPUT"

    - name: Create Milestone
      id: milestone
      uses: sv-tools/create-milestone-action@v2.0.0
      with:
        token: ${{ env.GITHUB_TOKEN || inputs.github-token }}
        title: ${{ steps.title.outputs.milestone_title }}
        state: open
        due_on: ${{ steps.date.outputs.milestone_due }}
        description: ${{ inputs.description }}
